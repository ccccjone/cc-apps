<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps</title>
<meta name="description" content="独立开发的小 App · Small apps, made with care">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23151413'/><text x='3' y='12' font-size='10' fill='%23d6d2c9'>✦</text></svg>">
<style>
  * { box-sizing: border-box; }
  html { background: #151413; }
  body {
    margin: 0 auto; padding: 56px 20px 64px; max-width: 640px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #d6d2c9; line-height: 1.8; font-size: 15px;
  }
  h1 { font-size: 14px; color: #8f887b; letter-spacing: .5em; text-transform: uppercase; margin: 0 0 8px; }
  .intro { color: #8f887b; font-size: 13px; margin: 0 0 36px;
           border-bottom: 1px dashed #2e2b27; padding-bottom: 20px; }
  .card {
    display: flex; justify-content: space-between; align-items: center; gap: 18px;
    border: 1px solid #2e2b27; border-radius: 14px; padding: 20px 22px;
    margin: 0 0 16px; text-decoration: none; color: inherit;
    transition: border-color .18s ease;
  }
  .card:hover { border-color: var(--c); }
  .card:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; }
  .card b { display: block; color: var(--c); font-weight: 400; letter-spacing: .1em; font-size: 15px; }
  .card .sub { color: #8f887b; font-size: 13px; }
  .icon { position: relative; flex: none; width: 26px; height: 36px; }
  .icon i {
    position: absolute; left: 3px; top: 3px; width: 5px; height: 5px;
    box-shadow:
      10px 0 0 0 var(--c), 15px 0 0 0 var(--c),
      5px 5px 0 0 var(--c),
      0 10px 0 0 var(--c), 0 15px 0 0 var(--c),
      5px 20px 0 0 var(--c),
      10px 25px 0 0 var(--c), 15px 25px 0 0 var(--c);
  }
  footer { margin-top: 44px; color: #6f6a60; font-size: 12px;
           border-top: 1px dashed #2e2b27; padding-top: 14px; }
  footer a { color: #8f887b; text-decoration: none; border-bottom: 1px solid #4a453e; }
</style>
</head>
<body>
<h1>Apps</h1>
<p class="intro">独立开发的小 App · Small apps, made with care</p>

<a class="card" href="bedtime-games/" style="--c:#e2a83e">
  <span>
    <b>晚安游戏机 · Bedtime Games</b>
    <span class="sub">复古掌机风睡前小游戏 · Calm retro puzzles for bedtime</span>
  </span>
  <span class="icon" aria-hidden="true"><i></i></span>
</a>

<footer>© 2026 · <a href="mailto:ariacuidev@gmail.com">ariacuidev@gmail.com</a></footer>
</body>
</html>
